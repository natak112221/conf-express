<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация | Конференции.РФ</title>
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="logo" href="index.html">Конференции<b>.РФ</b></a>
    <details class="menu">
      <summary aria-label="Меню"><span></span></summary>
      <nav><a href="index.html">Афиша</a><a href="my.html">Мои заявки</a><a href="login.html">Вход</a><a href="register.html">Регистрация</a></nav>
    </details>
  </div>
</header>
<main>
  <h1>Регистрация</h1>
  <p class="muted" style="margin-bottom:20px">Уже есть аккаунт? <a href="login.html">Войдите</a></p>
  <form>
    <div class="field"><label for="l">Логин</label><input id="l" autocomplete="username"><p class="hint">3-20 символов: латиница, цифры, _</p></div>
    <div class="field"><label for="e">Почта</label><input id="e" type="email" autocomplete="email"></div>
    <div class="field"><label for="t">Телефон</label><input id="t" type="tel" autocomplete="tel" placeholder="+7 900 123-45-67"></div>
    <div class="field"><label for="p">Пароль</label><input id="p" type="password" autocomplete="new-password"><p class="hint">Не короче 8 символов</p></div>
    <button class="btn" type="button">Зарегистрироваться</button>
  </form>
</main>
<nav class="tabbar"><a href="index.html">Афиша</a><a href="my.html">Заявки</a><a href="login.html" aria-current="page">Вход</a></nav>
</body>
</html>
